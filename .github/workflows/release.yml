name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint / check
        run: |
          python -m py_compile src/main.py src/server.py src/scanner.py
          python tools/fix_yara.py
          python src/scanner.py

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/install.ps1
            tools/uninstall.ps1
            tools/bootstrap.ps1
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
